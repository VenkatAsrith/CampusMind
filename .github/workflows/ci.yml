name: CampusMind CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          USE_MOCK_EMBEDDINGS: 'true'
          USE_MOCK_LLM: 'true'
          DATABASE_URL: 'sqlite:///./test.db'
          JWT_SECRET_KEY: 'test_ci_jwt_secret_key_minimum_length_required'
        run: |
          cd backend
          python -m pytest -v tests

  frontend-build-and-test:
    name: Frontend TypeScript, Unit Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Unit Tests
        run: |
          cd frontend
          npm test

      - name: Build Frontend Production Bundle
        run: |
          cd frontend
          npm run build
